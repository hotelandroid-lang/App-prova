<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nou Client — GespetSoft</title>
  <link rel="stylesheet" href="../css/style.css"/>
</head>
<body>
<nav class="nav">
  <a class="nav-brand" href="../index.html"><span class="nav-logo">🐾</span> GespetSoft</a>
  <div class="nav-links">
    <a href="../index.html" class="nav-item">Dashboard</a>
    <a href="reserves.html" class="nav-item">Reserves</a>
    <a href="clients.html" class="nav-item active">Clients</a>
    <a href="animals.html" class="nav-item">Animals</a>
    <a href="planning.html" class="nav-item">Planning</a>
    <a href="vendes.html" class="nav-item">Vendes</a>
    <a href="eines.html" class="nav-item">Eines</a>
    <a href="configuracio.html" class="nav-item">Configuració</a>
  </div>
</nav>
<div class="page-wrap" style="max-width:860px">
  <div class="page-header">
    <div class="page-title">Nou Client</div>
    <a href="clients.html" class="btn btn-secondary">← Tornar</a>
  </div>
  <div class="card">
    <div style="background:#EAF3DE;border-bottom:.5px solid #e5e7eb;padding:10px 1.25rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px">
      <div style="font-size:12px;color:#27500A">Envia un enllaç als teus clients perquè es registrin automàticament al teu negoci.</div>
      <button class="btn btn-primary" style="font-size:12px">👤 Enviar enllaç de registre automàtic</button>
    </div>
    <div class="form-grid">
      <div class="field-group"><label class="field-label">Codi</label>
        <div class="field-row"><div class="field-icon">🏷</div><input type="text" placeholder="Codi"/></div></div>
      <div class="field-group"><label class="field-label">Etiqueta</label>
        <div class="field-row"><div class="field-icon">🏷</div><select><option value="">Sense etiqueta</option><option>VIP</option><option>Regular</option><option>Nou</option></select></div></div>
      <div class="field-group"><label class="field-label">Nom<span class="required">*</span></label>
        <div class="field-row"><div class="field-icon">👤</div><input type="text" id="nom" placeholder="Nom"/></div></div>
      <div class="field-group"><label class="field-label">Cognoms<span class="required">*</span></label>
        <div class="field-row"><div class="field-icon">👤</div><input type="text" id="cognoms" placeholder="Cognoms"/></div></div>
      <div class="field-group"><label class="field-label">Data Naixement</label>
        <div class="field-row"><div class="field-icon">📅</div><input type="date"/></div></div>
      <div class="field-group"><label class="field-label">Idioma preferit</label>
        <div class="field-row"><div class="field-icon">🌐</div><select><option>SELECCIONEU</option><option>Català</option><option>Castellano</option><option>English</option></select></div></div>
      <div class="field-group"><label class="field-label">NIF</label>
        <div class="field-row"><div class="field-icon">📄</div><input type="text" placeholder="NIF"/></div></div>
      <div class="field-group"><label class="field-label">Email</label>
        <div class="field-row"><div class="field-icon">✉</div><input type="email" placeholder="Email"/></div></div>
      <div class="field-group"><label class="field-label">Tel. Fix</label>
        <div class="field-row"><div class="field-icon">📞</div><input type="tel" placeholder="Tel. Fix"/></div></div>
      <div class="field-group"><label class="field-label">Tel. Mòbil</label>
        <div class="field-row"><div class="field-icon">📱</div><input type="tel" placeholder="Tel. Mòbil"/></div></div>
      <div class="field-group"><label class="field-label">WhatsApp</label>
        <div class="field-row"><div class="field-icon">💬</div><input type="tel" placeholder="WhatsApp"/></div></div>
      <div class="field-group"><label class="field-label">Nomeni</label>
        <div class="field-row"><div class="field-icon">🏷</div><input type="text" placeholder="Malnom"/></div></div>
      <div class="section-sep">Adreça</div>
      <div class="field-group full"><label class="field-label">Adreça</label>
        <div class="field-row"><div class="field-icon">📍</div><input type="text" placeholder="Adreça"/></div></div>
      <div class="field-group"><label class="field-label">C.P.</label>
        <div class="field-row"><div class="field-icon">📮</div><input type="text" placeholder="Codi postal"/></div></div>
      <div class="field-group"><label class="field-label">Localitat</label>
        <div class="field-row"><div class="field-icon">🏙</div><input type="text" placeholder="Localitat"/></div></div>
      <div class="field-group"><label class="field-label">Província</label>
        <div class="field-row"><div class="field-icon">🗺</div><input type="text" placeholder="Província"/></div></div>
      <div class="field-group"><label class="field-label">País</label>
        <div class="field-row"><div class="field-icon">🌍</div><select><option selected>Espanya</option><option>França</option><option>Andorra</option><option>Portugal</option></select></div></div>
    </div>
    <div class="form-footer">
      <a href="clients.html" class="btn btn-secondary">Cancelar</a>
      <button class="btn btn-primary" onclick="guardar(false)">💾 Guardar</button>
      <button class="btn btn-primary" style="background:#185FA5" onclick="guardar(true)">🐾 Guardar i Afegir animal</button>
    </div>
  </div>
</div>
<script src="../js/app.js"></script>
<script>
function guardar(addAnimal){
  const nom=document.getElementById('nom').value.trim();
  const cog=document.getElementById('cognoms').value.trim();
  if(!nom){document.getElementById('nom').focus();return;}
  if(!cog){document.getElementById('cognoms').focus();return;}
  if(addAnimal){ window.location='nou-animal.html'; }
  else { window.location='clients.html'; }
}
</script>
</body>
</html>
