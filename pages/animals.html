<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Animals — GespetSoft</title>
  <link rel="stylesheet" href="../css/style.css"/>
</head>
<body>
<div id="nav-placeholder"></div>
<div class="page-wrap">
  <div class="page-header">
    <div class="page-title">Animals</div>
    <button class="btn btn-primary" onclick="window.location='nou-animal.html'">+ Nou animal</button>
  </div>
  <div class="card">
    <div class="toolbar">
      <div class="search-box" style="flex:1;min-width:180px">
        <span>🔍</span>
        <input type="text" id="search" placeholder="Cercar per nom, client, raça..." oninput="renderTable()"/>
      </div>
      <select class="filter-sel" id="f-tipus" onchange="renderTable()">
        <option value="">Tots els tipus</option>
        <option value="gos">Gossos</option>
        <option value="gat">Gats</option>
        <option value="conill">Conills</option>
      </select>
      <select class="filter-sel" id="f-estat" onchange="renderTable()">
        <option value="">Tots els estats</option>
        <option value="hotelat">Hotelat ara</option>
        <option value="actiu">A casa</option>
      </select>
    </div>
    <div style="overflow-x:auto">
      <table>
        <thead><tr>
          <th onclick="sortBy('id')">Codi</th>
          <th onclick="sortBy('nom')">Nom</th>
          <th onclick="sortBy('client')">Client</th>
          <th onclick="sortBy('tipus')">Tipus</th>
          <th onclick="sortBy('raca')">Raça</th>
          <th>Sexe</th>
          <th>Pes</th>
          <th onclick="sortBy('estat')">Estat</th>
          <th></th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="pagination">
      <div id="pag-info"></div>
      <div class="pag-btns" id="pag-btns"></div>
    </div>
  </div>
</div>
<script src="../js/app.js"></script>
<script>
let sortCol=null,sortAsc=true,page=1;
const PER=10;

function getClient(id){const c=DB.clients.find(x=>x.id===id);return c?`${c.nom} ${c.cognoms}`:'—';}

function getFiltered(){
  const q=document.getElementById('search').value.toLowerCase();
  const ft=document.getElementById('f-tipus').value;
  const fe=document.getElementById('f-estat').value;
  return DB.animals.filter(a=>{
    const nomClient=getClient(a.clientId).toLowerCase();
    const matchQ=!q||(a.nom.toLowerCase().includes(q)||nomClient.includes(q)||a.raca.toLowerCase().includes(q));
    const matchT=!ft||a.tipus===ft;
    const matchE=!fe||a.estat===fe;
    return matchQ&&matchT&&matchE;
  });
}

function sortBy(col){if(sortCol===col)sortAsc=!sortAsc;else{sortCol=col;sortAsc=true;}renderTable();}

function renderTable(){
  let data=getFiltered();
  if(sortCol){data=[...data].sort((a,b)=>{
    const va=String(a[sortCol]||'').toLowerCase();
    const vb=String(b[sortCol]||'').toLowerCase();
    return sortAsc?(va>vb?1:-1):(va<vb?1:-1);
  });}
  const total=data.length;
  const pages=Math.ceil(total/PER)||1;
  if(page>pages)page=1;
  const slice=data.slice((page-1)*PER,page*PER);
  document.getElementById('pag-info').textContent=total===0?'Cap resultat':`Mostrant ${(page-1)*PER+1}–${Math.min(page*PER,total)} de ${total}`;
  const pb=document.getElementById('pag-btns');pb.innerHTML='';
  for(let i=1;i<=pages;i++){const b=document.createElement('button');b.className='pag-btn'+(i===page?' active':'');b.textContent=i;b.onclick=(()=>{const p=i;return()=>{page=p;renderTable();}})();pb.appendChild(b);}
  const icon={gos:'🐶',gat:'🐱',conill:'🐰'};
  const avcls={gos:'av-green',gat:'av-blue',conill:'av-pink'};
  document.getElementById('tbody').innerHTML=slice.map(a=>`
    <tr style="cursor:pointer">
      <td style="color:#9ca3af;font-size:11px">${a.id}</td>
      <td><div style="display:flex;align-items:center;gap:8px">
        <div class="avatar ${avcls[a.tipus]}">${icon[a.tipus]}</div>
        <div>
          <div style="font-weight:500">${a.nom}</div>
          ${a.alergies?`<span class="badge" style="background:#FCEBEB;color:#A32D2D">Al·lèrgia</span>`:''}
        </div>
      </div></td>
      <td style="color:#6b7280">${getClient(a.clientId)}</td>
      <td><span class="badge badge-${a.tipus}">${a.tipus==='gos'?'Gos':a.tipus==='gat'?'Gat':'Conill'}</span></td>
      <td>${a.raca}</td>
      <td style="color:#6b7280">${a.sexe}</td>
      <td style="color:#6b7280">${a.pes} kg</td>
      <td><span class="badge badge-${a.estat==='hotelat'?'actiu':'inactiu'}">${a.estat==='hotelat'?'Hotelat':'A casa'}</span></td>
      <td><button class="btn btn-secondary" style="padding:4px 10px;font-size:11px">Editar</button></td>
    </tr>`).join('');
}

document.addEventListener('DOMContentLoaded',renderTable);
</script>
<script src="../js/nav.js"></script>
</body>
</html>
